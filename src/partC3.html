<script>
(function(){
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const icon = id => `<svg><use href="#i-${id}"/></svg>`;
const store = {
  get(k, d){ try{ const v = localStorage.getItem('tswb:'+k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('tswb:'+k, JSON.stringify(v)); }catch(e){} }
};
function copyText(txt, toastEl){
  const done = m => { if(toastEl){ toastEl.textContent = m; setTimeout(()=>{ toastEl.textContent=''; }, 3000); } };
  try{ navigator.clipboard.writeText(txt).then(()=>done('Copied to clipboard'), ()=>done('Copy was blocked in this view')); }
  catch(e){ done('Copy was blocked in this view'); }
}
const view = $('#view');
// Tool pages open with a hero band. Its icon and key stats come from the current route.
const HEAD_META = () => {
  const r = hashNow().split("/")[0] || "overview";
  const ai = ["Runs on your own Claude account", "Nothing stored on a server", "A person makes the final call"];
  const m = {
    premortem:["radar", () => [HARMS.length + " abuse risks", Object.keys(SG).length + " safeguards", REGIONS.length + " jurisdictions"]],
    postmortem:["doc", () => ["4 layers of failure", "The chapter 13 template", "Blameless by design"]],
    tabletop:["siren", () => [SCENARIOS.length + " crisis scenarios", (typeof ALL_TYPES !== "undefined" ? ALL_TYPES.length : 8) + " company types", "The law behind every call"]],
    metrics:["gauge", () => [METRICS.length + " metrics", Object.keys(MX_PLATFORMS).length + " platform types", "Starter SQL for each"]],
    vendors:["scale", () => [CRITERIA.length + " weighted criteria", "Wellness and security minimums", "RFP question bank"]],
    coverage:["cover", () => [CV_AREAS.length + " harm areas", CV_LAYERS.length + " layers of defense", "Risk vs coverage radar"]],
    maturity:["steps", () => [MA_AREAS.length + " program areas", MA_LEVELS.length + " maturity levels", "A phased roadmap"]],
    policy:["doc", () => ai], notice:["mail", () => ai], appeal:["appeal", () => ai], transparency:["chart", () => []],
    coppa:["coppa", () => ["The 2025 amended Rule", "4 ready-to-edit drafts", "The rule behind every requirement"]],
    grooming:["route", () => ["6 stages, find to exploit", (typeof GP_SG !== "undefined" ? GP_SG.length : 27) + " safeguards with sources", "No scripts, only what a platform can see"]],
    reporting:["flag", () => ["5 markets, duty by duty", "4 ready-to-edit drafts", "The first hour, in order"]],
    dsa:["dsa", () => ["Every duty, article by article", "4 ready-to-edit drafts", "Enforcement to learn from"]],
    eval:["eval", () => [EV_CATS.length + " kinds of hard case", "Precision and recall by kind", "Works with any classifier"]],
    tools:["layers", () => ["Use any tool on its own", "Free and private", "No sign-up"]],
    redteam:["shield", () => ["Plan, drills, findings, exports", "Learn as you go", "No attack strings"]],
    learn:["book", () => ["2 guides", "23 drills", (typeof LN_GLOSS !== "undefined" ? LN_GLOSS.length : 46) + " terms"]],
    redteamllm:["shield", () => [(typeof LN_GUIDES !== "undefined" ? LN_GUIDES.llm.steps.length : 9) + " steps", (typeof LN_GUIDES !== "undefined" ? LN_GUIDES.llm.exercises.length : 11) + " drills", "No attack strings"]],
    redteamworld:["world", () => [(typeof LN_GUIDES !== "undefined" ? LN_GUIDES.world.steps.length : 10) + " steps", (typeof LN_GUIDES !== "undefined" ? LN_GUIDES.world.exercises.length : 12) + " drills", "Uploads, steering, provenance"]],
    glossary:["glossary", () => [(typeof LN_GLOSS !== "undefined" ? LN_GLOSS.length : 46) + " terms", "Flashcards and a quiz", "Tagged by model type"]],
    tsglossary:["glossary", () => [(typeof TSG_TERMS !== "undefined" ? TSG_TERMS.length : 100) + " terms", "9 groups", "Search and browse A to Z"]],
    workspace:["folder", () => []], roost:["info", () => []], about:["info", () => [(typeof AB_GROUPS !== "undefined" ? AB_GROUPS.reduce((n, g) => n + g[1].length, 0) : 10) + " tools", "Free and private", "No sign-up"]]
  }[r];
  if(!m) return {icon:"logo", stats:[]};
  let stats = []; try{ stats = m[1](); }catch(e){}
  return {icon:m[0], stats};
};
// Which part of the workbench a page belongs to, as the sidebar groups it
const HEAD_GROUP = {redteam:"Prepare", plan:"Assess", maturity:"Assess", coverage:"Assess", premortem:"Assess", coppa:"Assess", grooming:"Assess", reporting:"Assess", dsa:"Assess", eval:"Measure", tabletop:"Prepare", postmortem:"Prepare", vendors:"Prepare", policy:"Prepare", metrics:"Measure", notice:"AI assistant", appeal:"AI assistant", transparency:"AI assistant", about:"Project"};
const headRoute = () => hashNow().split("/")[0] || "overview";
// Tool pages carry the assessment strip above the header, with the help button in it
const headStrip = () => { const r = headRoute(); return HEAD_GROUP[r] && r !== "about" && typeof asStepBar === "function" ? asStepBar(r, typeof asRoutePct === "function" ? asRoutePct(r) : null, true) : ""; };
const head = (title, desc, crumb, meta='') => { const hm = HEAD_META(), strip = headStrip(), r = headRoute(); return strip + `
  <div class="pagehead">
    <svg class="ph-mark" aria-hidden="true"><use href="#i-${hm.icon}"/></svg>
    <div class="ph-main">
      <div class="ph-eb">${tileHTML(hm.icon, TOOL_TONE[r], "sm")}${esc(HEAD_GROUP[r] || crumb || "T&S Workbench")}${!strip && typeof helpBtn === "function" ? helpBtn() : ""}</div>
      <h1>${title}</h1>
      <p>${desc}</p>
      ${hm.stats.length ? `<div class="ph-stats">${hm.stats.map(s => `<span>${esc(s)}</span>`).join("")}</div>` : ""}
    </div>
    ${meta?`<div class="headmeta">${meta}</div>`:''}
  </div>`; };
// Working screens (a question, a report, a scenario in progress, a plan) get a slim header so the work sits above the fold
const headCompact = (title, ctx, meta='') => { const hm = HEAD_META(), strip = headStrip(); return strip + `
  <div class="pagehead ph-compact">
    <div class="ph-main"><div class="ph-eb">${tileHTML(hm.icon, TOOL_TONE[headRoute()], "sm")}<h1 class="phc-t">${title}</h1>${ctx ? `<span class="phc-ctx">${ctx}</span>` : ""}${!strip && typeof helpBtn === "function" ? helpBtn() : ""}</div></div>
    ${meta?`<div class="headmeta">${meta}</div>`:''}
  </div>`; };
