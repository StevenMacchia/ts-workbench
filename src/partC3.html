<script>
(function(){
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const icon = id => `<svg><use href="#i-${id}"/></svg>`;
const store = {
  get(k, d){ try{ const v = localStorage.getItem('tswb:'+k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('tswb:'+k, JSON.stringify(v)); }catch(e){} }
};
function copyText(txt, toastEl){
  const done = m => { if(toastEl){ toastEl.textContent = m; setTimeout(()=>{ toastEl.textContent=''; }, 3000); } };
  try{ navigator.clipboard.writeText(txt).then(()=>done('Copied to clipboard'), ()=>done('Copy was blocked in this view')); }
  catch(e){ done('Copy was blocked in this view'); }
}
const view = $('#view');
// Tool pages open with a hero band. Its icon and key stats come from the current route.
const HEAD_META = () => {
  const r = (location.hash || "").slice(1).split("/")[0] || "overview";
  const ai = ["Runs on your own Claude account", "Nothing stored on a server", "A person makes the final call"];
  const m = {
    premortem:["radar", () => [HARMS.length + " abuse risks", Object.keys(SG).length + " safeguards", REGIONS.length + " jurisdictions"]],
    tabletop:["siren", () => [SCENARIOS.length + " crisis scenarios", "8 company types", "The law behind every call"]],
    metrics:["gauge", () => [METRICS.length + " metrics", Object.keys(MX_PLATFORMS).length + " platform types", "Starter SQL for each"]],
    vendors:["scale", () => [CRITERIA.length + " weighted criteria", "Wellness and security minimums", "RFP question bank"]],
    coverage:["cover", () => [CV_AREAS.length + " harm areas", CV_LAYERS.length + " layers of defense", "Risk vs coverage radar"]],
    maturity:["steps", () => [MA_AREAS.length + " program areas", MA_LEVELS.length + " maturity levels", "A phased roadmap"]],
    policy:["doc", () => ai], notice:["mail", () => ai], appeal:["appeal", () => ai], transparency:["chart", () => []],
    coppa:["coppa", () => ["The 2025 amended Rule", "4 ready-to-edit drafts", "The rule behind every requirement"]],
    tools:["layers", () => ["Use any tool on its own", "Free and private", "No sign-up"]],
    workspace:["user", () => []], about:["info", () => [(typeof AB_GROUPS !== "undefined" ? AB_GROUPS.reduce((n, g) => n + g[1].length, 0) : 10) + " tools", "Free and private", "No sign-up"]]
  }[r];
  if(!m) return {icon:"logo", stats:[]};
  let stats = []; try{ stats = m[1](); }catch(e){}
  return {icon:m[0], stats};
};
const head = (title, desc, crumb, meta='') => { const hm = HEAD_META(); return `
  <div class="pagehead">
    <svg class="ph-mark" aria-hidden="true"><use href="#i-${hm.icon}"/></svg>
    <div class="ph-main">
      <div class="ph-eb"><span class="sb-glyph ph-glyph"><svg><use href="#i-${hm.icon}"/></svg></span>${esc(crumb || "T&S Workbench")}${typeof helpBtn === "function" ? helpBtn() : ""}</div>
      <h1>${title}</h1>
      <p>${desc}</p>
      ${hm.stats.length ? `<div class="ph-stats">${hm.stats.map(s => `<span>${esc(s)}</span>`).join("")}</div>` : ""}
    </div>
    ${meta?`<div class="headmeta">${meta}</div>`:''}
  </div>`; };
// Working screens (a question, a report, a scenario in progress, a plan) get a slim header so the work sits above the fold
const headCompact = (title, ctx, meta='') => { const hm = HEAD_META(); return `
  <div class="pagehead ph-compact">
    <div class="ph-main"><div class="ph-eb"><span class="sb-glyph ph-glyph"><svg><use href="#i-${hm.icon}"/></svg></span><h1 class="phc-t">${title}</h1>${ctx ? `<span class="phc-ctx">${ctx}</span>` : ""}${typeof helpBtn === "function" ? helpBtn() : ""}</div></div>
    ${meta?`<div class="headmeta">${meta}</div>`:''}
  </div>`; };
