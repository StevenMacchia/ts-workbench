<!doctype html><html lang="en"><head><meta charset="utf-8"><title>og</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{font-family:Inter,sans-serif;color:#15172B;background:
  radial-gradient(760px 420px at 78% -12%, rgba(109,93,246,.32), transparent 62%),
  radial-gradient(560px 360px at 14% -4%, rgba(255,160,120,.30), transparent 60%),#F7F8FC;position:relative}
.top{position:absolute;left:72px;top:60px;display:flex;align-items:center;gap:12px;font-size:22px;font-weight:600}
.top i{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,#6D5DF6,#FF9A7A)}
.top span{color:#636A85;font-weight:400}
h1{position:absolute;left:72px;top:132px;width:560px;margin:0;font-size:74px;line-height:1.02;letter-spacing:-.04em;font-weight:800;
  background:linear-gradient(100deg,#15172B 40%,#6D5DF6 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
p{position:absolute;left:72px;top:470px;width:600px;margin:0;font-size:26px;line-height:1.35;color:#636A85}
.card{position:absolute;right:72px;top:150px;width:370px;padding:28px 30px 26px;background:rgba(255,255,255,.78);border:1px solid rgba(21,23,43,.10);border-radius:18px;box-shadow:0 1px 1px rgba(21,23,43,.04),0 18px 44px rgba(21,23,43,.10)}
.card h2{margin:0 0 14px;font-size:18px;font-weight:600}
.score{font-size:68px;font-weight:800;letter-spacing:-.04em;line-height:1}
.score small{font-size:20px;font-weight:400;color:#636A85;letter-spacing:0;margin-left:6px}
.rows{margin-top:18px;display:grid;gap:11px}
.rows div{display:grid;grid-template-columns:150px 1fr 36px;gap:14px;align-items:center;font-size:16px;font-weight:500}
.rows i{height:9px;border-radius:999px;background:#E6E8F0;overflow:hidden;display:block}
.rows i b{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#6D5DF6,#FF9A7A);width:var(--w)}
.rows span{text-align:right;font-family:"IBM Plex Mono",monospace;font-size:15px}
</style></head><body>
<div class="top"><i></i>T&amp;S Workbench <span>· free, private, no sign-up</span></div>
<h1>Trust &amp; Safety tools that work in your browser</h1>
<p>One guided assessment of your program, plus the tools to act on it.</p>
<div class="card"><h2>Your program picture</h2><div class="score">63<small>/ 100 · Grade C</small></div>
<div class="rows">
<div>Program maturity<i><b style="--w:75%"></b></i><span>75</span></div>
<div>Launch readiness<i><b style="--w:65%"></b></i><span>65</span></div>

<div>Policy clarity<i><b style="--w:52%"></b></i><span>52</span></div>
</div></div>
</body></html>
